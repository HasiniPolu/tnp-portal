<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - T&P Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#0b1f3a;color:white;display:flex;min-height:100vh;}
 
/* SIDEBAR */
.sidebar{width:230px;background:#08172d;padding:25px 15px;display:flex;flex-direction:column;gap:8px;position:fixed;height:100vh;overflow-y:auto;}
.sidebar h2{font-size:18px;letter-spacing:1px;padding:10px 10px 20px;border-bottom:1px solid #1e3a6e;margin-bottom:10px;}
.sidebar a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:#aac;text-decoration:none;font-size:14px;transition:0.3s;}
.sidebar a:hover,.sidebar a.active{background:#ff7a00;color:white;}
.sidebar .spacer{flex:1;}
.sidebar .logout{color:#ff4444;cursor:pointer;padding:11px 14px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:10px;}
.sidebar .logout:hover{background:#1e0000;}
 
/* MAIN */
.main{margin-left:230px;flex:1;padding:30px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
.topbar h1{font-size:24px;}
.topbar .user-info{font-size:14px;color:#aac;}
 
/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:30px;}
.stat-card{background:#122c52;border-radius:14px;padding:20px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,0.3);}
.stat-card .num{font-size:36px;font-weight:700;color:#ff7a00;}
.stat-card .label{font-size:13px;color:#aac;margin-top:5px;}
 
/* SECTION */
.section-title{font-size:18px;margin:25px 0 15px;border-left:4px solid #ff7a00;padding-left:12px;}
.table-wrap{background:#122c52;border-radius:14px;overflow:hidden;margin-bottom:25px;}
table{width:100%;border-collapse:collapse;}
th{background:#0d2244;padding:13px 16px;text-align:left;font-size:13px;color:#aac;}
td{padding:12px 16px;font-size:14px;border-top:1px solid #1e3a6e;}
tr:hover td{background:#0d2244;}
 
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.badge.present{background:rgba(0,230,118,0.15);color:#00e676;}
.badge.absent{background:rgba(255,68,68,0.15);color:#ff4444;}
.badge.enrolled{background:rgba(255,122,0,0.15);color:#ff7a00;}
</style>
</head>
<body>
 
<div class="sidebar">
  <h2>🎓 T&P Portal</h2>
  <a href="dashboard.html" class="active">🏠 Dashboard</a>
  <a href="courses.html">📚 Courses</a>
  <a href="attendance.html">📋 Attendance</a>
  <a href="projects.html">💼 Projects</a>
  <a href="certification.html">🏆 Certifications</a>
  <a href="remarks.html">📝 Remarks</a>
  <a href="reports.html">📊 Reports</a>
  <div class="spacer"></div>
  <div class="logout" onclick="logout()">🚪 Logout</div>
</div>
 
<div class="main">
  <div class="topbar">
    <h1>Welcome, <span id="studentName">Student</span> 👋</h1>
    <div class="user-info">Role: Student | <span id="studentEmail"></span></div>
  </div>
 
  <div class="stats">
    <div class="stat-card"><div class="num" id="totalCourses">0</div><div class="label">Courses Enrolled</div></div>
    <div class="stat-card"><div class="num" id="attendancePct">0%</div><div class="label">Attendance</div></div>
    <div class="stat-card"><div class="num" id="totalProjects">0</div><div class="label">Projects</div></div>
    <div class="stat-card"><div class="num" id="totalCerts">0</div><div class="label">Certifications</div></div>
  </div>
 
  <div class="section-title">My Courses</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Course</th><th>Instructor</th><th>Status</th></tr></thead>
      <tbody id="courseTable"><tr><td colspan="3" style="text-align:center;color:#aac;">Loading...</td></tr></tbody>
    </table>
  </div>
 
  <div class="section-title">Recent Attendance</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Date</th><th>Course</th><th>Status</th></tr></thead>
      <tbody id="attendanceTable"><tr><td colspan="3" style="text-align:center;color:#aac;">Loading...</td></tr></tbody>
    </table>
  </div>
</div>
 
<script src="config.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");
 
if(!user || user.role !== "student"){ window.location.href="index.html"; }
 
document.getElementById("studentName").textContent = user.name || "Student";
document.getElementById("studentEmail").textContent = user.email || "";
 
function authHeader(){ return { "Content-Type":"application/json", "Authorization":"Bearer "+token }; }
 
// Load courses
fetch(BASE_URL+"/courses/my", { headers: authHeader() })
.then(r=>r.json()).then(data=>{
  const tbody = document.getElementById("courseTable");
  if(data.courses && data.courses.length){
    document.getElementById("totalCourses").textContent = data.courses.length;
    tbody.innerHTML = data.courses.map(c=>`
      <tr>
        <td>${c.title}</td>
        <td>${c.instructor||"N/A"}</td>
        <td><span class="badge enrolled">Enrolled</span></td>
      </tr>`).join("");
  } else {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#aac;">No courses enrolled</td></tr>`;
  }
}).catch(()=>{});
 
// Load attendance
fetch(BASE_URL+"/attendance/my", { headers: authHeader() })
.then(r=>r.json()).then(data=>{
  const tbody = document.getElementById("attendanceTable");
  if(data.records && data.records.length){
    const present = data.records.filter(r=>r.status==="present").length;
    const pct = Math.round((present/data.records.length)*100);
    document.getElementById("attendancePct").textContent = pct+"%";
    tbody.innerHTML = data.records.slice(0,8).map(r=>`
      <tr>
        <td>${new Date(r.date).toLocaleDateString()}</td>
        <td>${r.courseTitle||"N/A"}</td>
        <td><span class="badge ${r.status}">${r.status}</span></td>
      </tr>`).join("");
  } else {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#aac;">No attendance records</td></tr>`;
  }
}).catch(()=>{});
 
function logout(){
  localStorage.removeItem("user");
  localStorage.removeItem("token");
  window.location.href="index.html";
}
</script>
</body>
</html>
