<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certifications - T&P Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#0b1f3a;color:white;display:flex;min-height:100vh;}
.sidebar{width:230px;background:#08172d;padding:25px 15px;display:flex;flex-direction:column;gap:8px;position:fixed;height:100vh;}
.sidebar h2{font-size:18px;letter-spacing:1px;padding:10px 10px 20px;border-bottom:1px solid #1e3a6e;margin-bottom:10px;}
.sidebar a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:#aac;text-decoration:none;font-size:14px;transition:0.3s;}
.sidebar a:hover,.sidebar a.active{background:#ff7a00;color:white;}
.sidebar .spacer{flex:1;}
.sidebar .logout{color:#ff4444;cursor:pointer;padding:11px 14px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:10px;}
.sidebar .logout:hover{background:#1e0000;}
.main{margin-left:230px;flex:1;padding:30px;}
.section-title{font-size:18px;margin:25px 0 15px;border-left:4px solid #ff7a00;padding-left:12px;}
.form-card{background:#122c52;border-radius:14px;padding:25px;margin-bottom:25px;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px;}
input,select{width:100%;padding:11px;border-radius:8px;border:none;outline:none;background:#0b1f3a;color:white;}
.btn{padding:11px 24px;background:#ff7a00;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;}
.btn:hover{background:#ff8f1f;}
.msg{margin-top:10px;font-size:13px;min-height:18px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
.cert-card{background:#122c52;border-radius:14px;padding:20px;border-left:4px solid #ff7a00;box-shadow:0 5px 20px rgba(0,0,0,0.3);}
.cert-card h3{font-size:16px;margin-bottom:8px;}
.cert-card p{font-size:13px;color:#aac;}
.cert-card a{color:#ff7a00;text-decoration:none;font-size:13px;}
.cert-card a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="sidebar">
  <h2>🏆 T&P Portal</h2>
  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="courses.html">📚 Courses</a>
  <a href="attendance.html">📋 Attendance</a>
  <a href="projects.html">💼 Projects</a>
  <a href="certification.html" class="active">🏆 Certifications</a>
  <a href="remarks.html">📝 Remarks</a>
  <a href="reports.html">📊 Reports</a>
  <div class="spacer"></div>
  <div class="logout" onclick="logout()">🚪 Logout</div>
</div>
<div class="main">
  <h1 style="font-size:24px;margin-bottom:30px;">Certifications 🏆</h1>

  <div class="section-title">Add Certification</div>
  <div class="form-card">
    <div class="form-row">
      <input id="certName" placeholder="Certification Name">
      <input id="certIssuer" placeholder="Issuing Organization">
      <input id="certDate" type="date" placeholder="Date">
      <input id="certId" placeholder="Certificate ID (optional)">
      <input id="certFile" type="file" accept=".pdf,.jpg,.png,.jpeg">
    </div>
    <button class="btn" onclick="addCert()">➕ Add Certification</button>
    <div class="msg" id="certMsg"></div>
  </div>

  <div class="section-title">My Certifications</div>
  <div class="cards" id="certsContainer">
    <div style="color:#aac;grid-column:1/-1;text-align:center;">Loading...</div>
  </div>
</div>
<script src="config.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");
if(!user){ window.location.href="index.html"; }
function authHeader(){ return {"Authorization":"Bearer "+token}; }

function loadCerts(){
  fetch(BASE_URL + "/certifications/my", { headers: authHeader() })
  .then(r=>r.json()).then(data=>{
    const container = document.getElementById("certsContainer");
    if(data.success && data.certifications && data.certifications.length){
      container.innerHTML = data.certifications.map(c=>`
        <div class="cert-card">
          <h3>🏅 ${c.course}</h3>
          <p>📍 ${c.grade||"N/A"}</p>
          <p>📅 ${c.issueDate ? new Date(c.issueDate).toLocaleDateString() : "N/A"}</p>
          ${c.certNo?`<p>🆔 ${c.certNo}</p>`:""}
          ${c.fileUrl?`<p><a href="${c.fileUrl}" target="_blank">📂 View File</a></p>`:""}
        </div>`).join("");
    } else {
      container.innerHTML = `<div style="color:#aac;grid-column:1/-1;text-align:center;">No certifications added yet</div>`;
    }
  }).catch(()=>{});
}
loadCerts();

function addCert(){
  const msg = document.getElementById("certMsg");
  const formData = new FormData();
  formData.append("name", document.getElementById("certName").value.trim());
  formData.append("issuer", document.getElementById("certIssuer").value.trim());
  formData.append("date", document.getElementById("certDate").value);
  formData.append("certId", document.getElementById("certId").value.trim());
  const fileInput = document.getElementById("certFile");
  if(fileInput.files.length > 0){
    formData.append("file", fileInput.files[0]);
  }

  if(!formData.get("name")){ msg.style.color="#ff4444"; msg.textContent="Name required"; return; }
fetch(BASE_URL + "/certifications", { method:"POST", headers: {"Authorization":"Bearer "+token}, body: formData })

  .then(r=>r.json()).then(data=>{
    if(data.success){ msg.style.color="#00e676"; msg.textContent="Added ✅"; loadCerts(); }
    else { msg.style.color="#ff4444"; msg.textContent = data.message||"Failed"; }
  }).catch(()=>{ msg.style.color="#ff4444"; msg.textContent="Server error"; });
}

function logout(){ localStorage.removeItem("user"); localStorage.removeItem("token"); window.location.href="index.html"; }
</script>
</body>
</html>
