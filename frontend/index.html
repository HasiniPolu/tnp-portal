<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&P Portal - Login & Register</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0b1f3a 0%, #1a3a6b 100%);
    color: white;
    min-height: 100vh;
}

/* NAVBAR */
nav {
    padding: 20px 50px;
    background: rgba(8, 23, 45, 0.95);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav h2 {
    font-size: 26px;
    letter-spacing: 1px;
    color: #ff7a00;
    font-weight: 600;
}

nav p {
    color: #b0b0b0;
    font-size: 14px;
}

/* MAIN CONTAINER */
.main-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 80px);
    padding: 40px 20px;
}

/* CONTENT WRAPPER */
.content-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 50px;
    max-width: 1200px;
    width: 100%;
    align-items: center;
}

/* LEFT SIDE - IMAGE */
.left-side {
    display: flex;
    justify-content: center;
    align-items: center;
}

.image-container {
    position: relative;
    width: 100%;
    max-width: 450px;
}

.image-container img {
    width: 100%;
    height: auto;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(255, 122, 0, 0.2);
    display: block;
}

.image-overlay {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255, 122, 0, 0.9);
    padding: 15px 25px;
    border-radius: 50px;
    font-weight: 600;
    color: white;
    font-size: 14px;
}

/* RIGHT SIDE - FORM */
.right-side {
    display: flex;
    justify-content: center;
}

.form-container {
    background: rgba(18, 44, 82, 0.9);
    backdrop-filter: blur(10px);
    padding: 50px 40px;
    border-radius: 15px;
    width: 100%;
    max-width: 420px;
    border: 1px solid rgba(255, 122, 0, 0.15);
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
}

/* TABS */
.tabs {
    display: flex;
    margin-bottom: 35px;
    gap: 10px;
    background: rgba(8, 23, 45, 0.6);
    padding: 8px;
    border-radius: 10px;
}

.tabs button {
    flex: 1;
    padding: 12px 20px;
    background: transparent;
    border: none;
    color: #b0b0b0;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.tabs button.active {
    background: #ff7a00;
    color: white;
    box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3);
}

/* FORM TITLE */
.form-title {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 25px;
    color: white;
}

/* FORM GROUPS */
.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #e0e0e0;
    font-weight: 500;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 12px 15px;
    margin: 0;
    border: 1px solid rgba(255, 122, 0, 0.2);
    border-radius: 8px;
    background: rgba(11, 31, 58, 0.8);
    color: white;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.3s ease;
}

input::placeholder {
    color: #666;
}

input:focus, select:focus {
    outline: none;
    border-color: #ff7a00;
    background: rgba(26, 58, 107, 0.8);
    box-shadow: 0 0 15px rgba(255, 122, 0, 0.2);
}

select {
    cursor: pointer;
}

/* SUBMIT BUTTON */
button.submit-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #ff7a00 0%, #ffaa44 100%);
    border: none;
    color: white;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    border-radius: 8px;
    margin-top: 10px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3);
}

button.submit-btn:hover {
    background: linear-gradient(135deg, #ff8f1f 0%, #ffb85a 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 122, 0, 0.4);
}

button.submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* MESSAGE */
.msg {
    text-align: center;
    margin-top: 15px;
    min-height: 20px;
    font-size: 14px;
    padding: 10px;
    border-radius: 6px;
    color: #ff7a00;
    font-weight: 500;
}

.msg.error {
    color: #ff6b6b;
    background: rgba(255, 107, 107, 0.1);
}

.msg.success {
    color: #51cf66;
    background: rgba(81, 207, 102, 0.1);
}

/* FOOTER */
footer {
    text-align: center;
    padding: 25px;
    background: rgba(8, 23, 45, 0.95);
    color: #888;
    font-size: 14px;
    margin-top: 0;
}

/* RESPONSIVE */
@media (max-width: 1024px) {
    .content-wrapper {
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .left-side {
        order: 2;
    }

    .right-side {
        order: 1;
    }

    .image-container {
        max-width: 350px;
    }

    .form-container {
        max-width: 100%;
    }
}

@media (max-width: 768px) {
    nav {
        padding: 15px 20px;
        flex-direction: column;
        gap: 10px;
    }

    nav h2 {
        font-size: 20px;
    }

    nav p {
        font-size: 12px;
    }

    .main-container {
        padding: 20px 10px;
    }

    .content-wrapper {
        gap: 20px;
    }

    .form-container {
        padding: 40px 25px;
    }

    .form-title {
        font-size: 24px;
    }

    .left-side {
        display: none;
    }

    .image-container {
        max-width: 100%;
    }
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav>
    <h2>🎓 T&P Portal</h2>
    <p>Training & Placement Management System</p>
</nav>

<!-- MAIN CONTAINER -->
<div class="main-container">
    <div class="content-wrapper">
        
        <!-- LEFT SIDE - IMAGE -->
        <div class="left-side">
            <div class="image-container">
                <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?w=500&h=600&fit=crop" alt="Professional Training">
                <div class="image-overlay">🚀 Join Now</div>
            </div>
        </div>

        <!-- RIGHT SIDE - FORM -->
        <div class="right-side">
            <div class="form-container">

                <!-- TABS -->
                <div class="tabs">
                    <button class="active" onclick="switchTab('login')">📝 Login</button>
                    <button onclick="switchTab('register')">✍️ Register</button>
                </div>

                <!-- LOGIN FORM -->
                <div id="login">
                    <h3 class="form-title">Welcome Back</h3>
                    
                    <div class="form-group">
                        <label>👤 Select Role</label>
                        <select id="role">
                            <option value="student">Student</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>📧 Email Address</label>
                        <input id="email" type="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label>🔒 Password</label>
                        <input id="password" type="password" placeholder="Enter your password">
                    </div>

                    <button class="submit-btn" onclick="login()">Login</button>
                    
                    <div class="msg" id="loginMsg"></div>
                </div>

                <!-- REGISTER FORM -->
                <div id="register" style="display:none;">
                    <h3 class="form-title">Create Account</h3>
                    
                    <div class="form-group">
                        <label>👤 Full Name</label>
                        <input id="rname" type="text" placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label>📧 Email Address</label>
                        <input id="remail" type="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label>🔒 Password</label>
                        <input id="rpassword" type="password" placeholder="Create a password (min 6 chars)">
                    </div>

                    <div class="form-group">
                        <label>🆔 Roll No / Employee ID</label>
                        <input id="roll" type="text" placeholder="e.g., 21BCS001">
                    </div>

                    <div class="form-group">
                        <label>🏢 Branch / Department</label>
                        <input id="branch" type="text" placeholder="e.g., Computer Science">
                    </div>

                    <div class="form-group">
                        <label>👤 Select Role</label>
                        <select id="rrole">
                            <option value="student">Student</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <button class="submit-btn" onclick="register()">Register</button>
                    
                    <div class="msg" id="registerMsg"></div>
                </div>

            </div>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer>
    <p>&copy; 2024 Training & Placement Portal. All rights reserved.</p>
</footer>

<script>
const BASE_URL = "http://localhost:5000/api";

console.log("Page loaded. BASE_URL:", BASE_URL);

// Switch tabs
function switchTab(tab){
    console.log("Switching to tab:", tab);
    document.getElementById("login").style.display = tab === "login" ? "block" : "none";
    document.getElementById("register").style.display = tab === "register" ? "block" : "none";
    
    // Update active tab button
    document.querySelectorAll(".tabs button").forEach(btn => {
        btn.classList.remove("active");
    });
    event.target.classList.add("active");
    
    // Clear messages
    document.getElementById("loginMsg").innerText = "";
    document.getElementById("registerMsg").innerText = "";
}

// LOGIN FUNCTION
function login(){
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const roleSelected = document.getElementById("role").value;
    const msgEl = document.getElementById("loginMsg");

    console.log("Login attempt:", { email, password: "***", role: roleSelected });

    if (!email || !password) {
        msgEl.innerText = "❌ Please fill in all fields";
        msgEl.classList.add("error");
        msgEl.classList.remove("success");
        return;
    }

    const loginUrl = BASE_URL + "/auth/login";
    console.log("Posting to:", loginUrl);

    fetch(loginUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            email: email,
            password: password,
            role: roleSelected
        })
    })
    .then(r => {
        console.log("Response status:", r.status);
        return r.json();
    })
    .then(data => {
        console.log("Login response:", data);
        
        if(data.success){
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));
            
            msgEl.innerText = "✅ Login successful! Redirecting...";
            msgEl.classList.remove("error");
            msgEl.classList.add("success");
            
            console.log("User role:", data.user.role);
            let redirectPage = data.user.role === "admin" ? "./admin.html" : "./dashboard.html";
            console.log("Redirecting to:", redirectPage);
            
            setTimeout(() => {
                window.location.href = redirectPage;
            }, 1500);
        } else {
            msgEl.innerText = "❌ " + (data.message || "Login failed");
            msgEl.classList.add("error");
            msgEl.classList.remove("success");
        }
    })
    .catch(err => {
        console.error("Login error:", err);
        msgEl.innerText = "❌ Server error - Make sure backend is running on port 5000";
        msgEl.classList.add("error");
        msgEl.classList.remove("success");
    });
}

// REGISTER FUNCTION
function register(){
    const name = document.getElementById("rname").value.trim();
    const email = document.getElementById("remail").value.trim();
    const password = document.getElementById("rpassword").value.trim();
    const roll = document.getElementById("roll").value.trim();
    const branch = document.getElementById("branch").value.trim();
    const role = document.getElementById("rrole").value;
    const msgEl = document.getElementById("registerMsg");

    console.log("Register attempt:", { name, email, password: "***", roll, branch, role });

    if (!name || !email || !password || !roll || !branch) {
        msgEl.innerText = "❌ Please fill in all fields";
        msgEl.classList.add("error");
        msgEl.classList.remove("success");
        return;
    }

    if (password.length < 6) {
        msgEl.innerText = "❌ Password must be at least 6 characters";
        msgEl.classList.add("error");
        msgEl.classList.remove("success");
        return;
    }

    const registerUrl = BASE_URL + "/auth/register";
    console.log("Posting to:", registerUrl);

    fetch(registerUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: name,
            email: email,
            password: password,
            rollNo: roll,
            branch: branch,
            role: role
        })
    })
    .then(r => {
        console.log("Response status:", r.status);
        return r.json();
    })
    .then(data => {
        console.log("Register response:", data);
        
        if(data.success) {
            msgEl.innerText = "✅ Registration successful! Switching to login...";
            msgEl.classList.remove("error");
            msgEl.classList.add("success");
            
            // Clear form
            document.getElementById("rname").value = "";
            document.getElementById("remail").value = "";
            document.getElementById("rpassword").value = "";
            document.getElementById("roll").value = "";
            document.getElementById("branch").value = "";
            document.getElementById("rrole").value = "student";
            
            // Switch to login after 2 seconds
            setTimeout(() => {
                document.getElementById("login").style.display = "block";
                document.getElementById("register").style.display = "none";
                document.querySelectorAll(".tabs button").forEach(btn => {
                    btn.classList.remove("active");
                });
                document.querySelectorAll(".tabs button")[0].classList.add("active");
                document.getElementById("loginMsg").innerText = "";
                document.getElementById("registerMsg").innerText = "";
            }, 2000);
        } else {
            msgEl.innerText = "❌ " + (data.message || "Registration failed");
            msgEl.classList.add("error");
            msgEl.classList.remove("success");
        }
    })
    .catch(err => {
        console.error("Register error:", err);
        msgEl.innerText = "❌ Server error - Make sure backend is running on port 5000";
        msgEl.classList.add("error");
        msgEl.classList.remove("success");
    });
}
</script>

</body>
</html>
