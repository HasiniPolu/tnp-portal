<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects - T&P Portal</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#0b1f3a;color:white;display:flex;min-height:100vh;}

.sidebar{width:230px;background:#08172d;padding:25px 15px;display:flex;flex-direction:column;gap:8px;position:fixed;height:100vh;}
.sidebar h2{font-size:18px;letter-spacing:1px;padding:10px 10px 20px;border-bottom:1px solid #1e3a6e;margin-bottom:10px;}
.sidebar a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:#aac;text-decoration:none;font-size:14px;}
.sidebar a:hover,.sidebar a.active{background:#ff7a00;color:white;}
.sidebar .spacer{flex:1;}
.sidebar .logout{color:#ff4444;cursor:pointer;padding:11px 14px;border-radius:10px;font-size:14px;}
.sidebar .logout:hover{background:#1e0000;}

.main{margin-left:230px;flex:1;padding:30px;}
.section-title{font-size:18px;margin:25px 0 15px;border-left:4px solid #ff7a00;padding-left:12px;}

.form-card{background:#122c52;border-radius:14px;padding:25px;margin-bottom:25px;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px;}

input,textarea{
width:100%;padding:11px;border-radius:8px;border:none;outline:none;
background:#0b1f3a;color:white;
}

textarea{min-height:70px;resize:vertical;}

.btn{
padding:11px 24px;background:#ff7a00;color:white;border:none;
border-radius:8px;cursor:pointer;font-weight:600;
}

.btn:hover{background:#ff8f1f;}

.msg{margin-top:10px;font-size:13px;min-height:18px;}

.table-wrap{background:#122c52;border-radius:14px;overflow:hidden;margin-bottom:25px;}

table{width:100%;border-collapse:collapse;}

th{background:#0d2244;padding:13px 16px;text-align:left;font-size:13px;color:#aac;}
td{padding:12px 16px;font-size:14px;border-top:1px solid #1e3a6e;}
tr:hover td{background:#0d2244;}
</style>
</head>

<body>

<div class="sidebar">
  <h2>💼 T&P Portal</h2>
  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="courses.html">📚 Courses</a>
  <a href="attendance.html">📋 Attendance</a>
  <a href="projects.html" class="active">💼 Projects</a>
  <a href="certification.html">🏆 Certifications</a>
  <a href="remarks.html">📝 Remarks</a>
  <a href="reports.html">📊 Reports</a>
  <div class="spacer"></div>
  <div class="logout" onclick="logout()">🚪 Logout</div>
</div>

<div class="main">

<h1 style="font-size:24px;margin-bottom:30px;">Projects 💼</h1>

<div class="section-title">Add Project</div>

<div class="form-card">
  <div class="form-row">
    <input id="projTitle" placeholder="Project Title">
    <input id="projTech" placeholder="Technologies Used">
    <input id="projLink" placeholder="GitHub / Live Link">
  </div>

  <textarea id="projDesc" placeholder="Description"></textarea><br><br>

  <button class="btn" onclick="addProject()">➕ Add Project</button>
  <div class="msg" id="projMsg"></div>
</div>

<div class="section-title">My Projects</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Technologies</th>
      <th>Link</th>
    </tr>
  </thead>
  <tbody id="projTable">
    <tr><td colspan="3" style="text-align:center;color:#aac;">Loading...</td></tr>
  </tbody>
</table>
</div>

</div>

<script src="config.js"></script>

<script>
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");

if(!user || !token){
  window.location.href = "index.html";
}

/* IMPORTANT FIX: correct headers */
function authHeader(){
  return {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token
  };
}

/* ================= LOAD PROJECTS ================= */
function loadProjects(){

  fetch(BASE_URL + "/projects/my", {
    headers: authHeader()
  })
  .then(res => res.json())
  .then(data => {

    const tbody = document.getElementById("projTable");

    if(data.success && data.projects && data.projects.length){

      tbody.innerHTML = data.projects.map(p => `
        <tr>
          <td>${p.title || ""}</td>
          <td>${p.technologies || "N/A"}</td>
          <td>
            ${p.link ? `<a href="${p.link}" target="_blank" style="color:#ff7a00;">View</a>` : "N/A"}
          </td>
        </tr>
      `).join("");

    } else {
      tbody.innerHTML = `
        <tr><td colspan="3" style="text-align:center;color:#aac;">No projects added</td></tr>
      `;
    }
  })
  .catch(err => {
    console.log(err);
  });
}

loadProjects();

/* ================= ADD PROJECT ================= */
function addProject(){

  const msg = document.getElementById("projMsg");

  const body = {
    title: document.getElementById("projTitle").value.trim(),
    technologies: document.getElementById("projTech").value.trim(),
    link: document.getElementById("projLink").value.trim(),
    description: document.getElementById("projDesc").value.trim()
  };

  if(!body.title){
    msg.style.color = "#ff4444";
    msg.textContent = "Title required";
    return;
  }

  fetch(BASE_URL + "/projects", {
    method: "POST",
    headers: authHeader(),
    body: JSON.stringify(body)
  })
  .then(res => res.json())
  .then(data => {

    if(data.success){
      msg.style.color = "#00e676";
      msg.textContent = "Project added ✅";

      document.getElementById("projTitle").value = "";
      document.getElementById("projTech").value = "";
      document.getElementById("projLink").value = "";
      document.getElementById("projDesc").value = "";

      loadProjects();
    } else {
      msg.style.color = "#ff4444";
      msg.textContent = data.message || "Failed";
    }
  })
  .catch(() => {
    msg.style.color = "#ff4444";
    msg.textContent = "Server error";
  });
}

/* ================= LOGOUT ================= */
function logout(){
  localStorage.removeItem("user");
  localStorage.removeItem("token");
  window.location.href = "index.html";
}
</script>

</body>
</html>
