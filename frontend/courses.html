<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses - T&P Portal</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background: #0b1f3a;
  color: white;
  display: flex;
  min-height: 100vh;
}

/* ============ SIDEBAR ============ */
.sidebar {
  width: 230px;
  background: #08172d;
  padding: 25px 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
}

.sidebar h2 {
  font-size: 18px;
  letter-spacing: 1px;
  padding: 10px 10px 20px;
  border-bottom: 1px solid #1e3a6e;
  margin-bottom: 10px;
}

.sidebar a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 10px;
  color: #aac;
  text-decoration: none;
  font-size: 14px;
  transition: 0.3s;
}

.sidebar a:hover,
.sidebar a.active {
  background: #ff7a00;
  color: white;
}

.sidebar .spacer {
  flex: 1;
}

.sidebar .logout {
  color: #ff4444;
  cursor: pointer;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: 0.3s;
}

.sidebar .logout:hover {
  background: #1e0000;
}

/* ============ MAIN CONTENT ============ */
.main {
  margin-left: 230px;
  flex: 1;
  padding: 30px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  flex-wrap: wrap;
  gap: 15px;
}

.page-header h1 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.search-bar {
  display: flex;
  gap: 10px;
  flex: 1;
  min-width: 250px;
  max-width: 400px;
}

.search-bar input {
  flex: 1;
  padding: 10px 16px;
  background: #122c52;
  border: 1px solid #1e3a6e;
  border-radius: 8px;
  color: white;
  outline: none;
  transition: 0.3s;
  font-size: 13px;
}

.search-bar input:focus {
  border-color: #ff7a00;
  box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.1);
}

.search-bar input::placeholder {
  color: #666;
}

/* ============ FILTERS ============ */
.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 8px 16px;
  background: #122c52;
  border: 1px solid #1e3a6e;
  color: #aac;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: 0.3s;
}

.filter-btn:hover,
.filter-btn.active {
  background: #ff7a00;
  color: white;
  border-color: #ff7a00;
}

/* ============ STATS SECTION ============ */
.stats-section {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: #122c52;
  border-radius: 12px;
  padding: 20px;
  border-left: 4px solid #ff7a00;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.stat-card .stat-number {
  font-size: 28px;
  font-weight: 700;
  color: #ff7a00;
  margin-bottom: 5px;
}

.stat-card .stat-label {
  font-size: 13px;
  color: #aac;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ============ COURSES GRID ============ */
.courses-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.course-card {
  background: #122c52;
  border-radius: 12px;
  padding: 24px;
  border-left: 4px solid #ff7a00;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
  transition: 0.3s ease;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.course-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 30px rgba(255, 122, 0, 0.2);
}

.course-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.course-title {
  font-size: 18px;
  font-weight: 600;
  color: white;
  word-break: break-word;
  flex: 1;
}

.course-badge {
  background: #ff7a00;
  color: white;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.course-desc {
  font-size: 13px;
  color: #aac;
  line-height: 1.5;
  min-height: 40px;
}

.course-meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px solid #1e3a6e;
  padding-top: 12px;
  font-size: 12px;
  color: #aac;
}

.course-meta-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.course-meta-item strong {
  color: #ff7a00;
  min-width: 80px;
}

.course-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.btn {
  flex: 1;
  padding: 10px 14px;
  background: #ff7a00;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  transition: 0.3s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn:hover {
  background: #ff8f1f;
}

.btn-secondary {
  background: #1e3a6e;
  color: #ff7a00;
  border: 1px solid #ff7a00;
}

.btn-secondary:hover {
  background: #2a4a7f;
}

/* ============ EMPTY STATE ============ */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #aac;
}

.empty-state svg {
  width: 100px;
  height: 100px;
  margin-bottom: 20px;
  opacity: 0.5;
}

.empty-state h3 {
  font-size: 20px;
  margin-bottom: 10px;
  color: white;
}

.empty-state p {
  font-size: 14px;
  margin-bottom: 20px;
}

/* ============ LOADING STATE ============ */
.loading {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 20px;
  color: #aac;
}

.loading-spinner {
  border: 3px solid #1e3a6e;
  border-top: 3px solid #ff7a00;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin-right: 15px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ============ RESPONSIVE ============ */
@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    height: auto;
    padding: 15px;
    position: relative;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: visible;
  }

  .main {
    margin-left: 0;
    padding: 20px;
  }

  .page-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .search-bar {
    max-width: 100%;
  }

  .courses-container {
    grid-template-columns: 1fr;
  }

  .sidebar .spacer {
    display: none;
  }

  .sidebar .logout {
    order: 999;
  }
}

@media (max-width: 480px) {
  .main {
    padding: 15px;
  }

  .page-header h1 {
    font-size: 22px;
  }

  .course-card {
    padding: 16px;
  }

  .course-title {
    font-size: 16px;
  }

  .stat-card {
    padding: 15px;
  }

  .stat-card .stat-number {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<!-- ============ SIDEBAR ============ -->
<div class="sidebar">
  <h2>🏆 T&P Portal</h2>
  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="courses.html" class="active">📚 Courses</a>
  <a href="attendance.html">📋 Attendance</a>
  <a href="projects.html">💼 Projects</a>
  <a href="certification.html">🏆 Certifications</a>
  <a href="remarks.html">📝 Remarks</a>
  <a href="reports.html">📊 Reports</a>
  <div class="spacer"></div>
  <div class="logout" onclick="logout()">🚪 Logout</div>
</div>

<!-- ============ MAIN CONTENT ============ -->
<div class="main">
  
  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>📚 Courses</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search courses...">
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-section">
    <div class="stat-card">
      <div class="stat-number" id="totalCourses">0</div>
      <div class="stat-label">Total Courses</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="enrolledCourses">0</div>
      <div class="stat-label">Enrolled Courses</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="completedCourses">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="inProgressCourses">0</div>
      <div class="stat-label">In Progress</div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter-btn active" onclick="filterCourses('all')">All Courses</button>
    <button class="filter-btn" onclick="filterCourses('enrolled')">Enrolled</button>
    <button class="filter-btn" onclick="filterCourses('available')">Available</button>
  </div>

  <!-- COURSES GRID -->
  <div class="courses-container" id="coursesGrid"></div>

  <!-- EMPTY STATE -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <h3>📖 No courses found</h3>
    <p>No courses match your search or filter criteria.</p>
  </div>

</div>

<script>
const BASE_URL = "http://localhost:5000/api";
let allCourses = [];
let currentFilter = 'all';

// 🔐 Check login
function checkAuth(){
    const token = localStorage.getItem("token");
    if(!token){
        window.location.href = "./index.html";
    }
}

// 🔑 Auth header
function authHeader(){
    return {
        "Content-Type":"application/json",
        "Authorization":"Bearer " + localStorage.getItem("token")
    };
}

// ✅ LOAD COURSES FROM ADMIN (MongoDB)
function loadCourses(){
    const grid = document.getElementById("coursesGrid");
    grid.innerHTML = '<div class="loading"><div class="loading-spinner"></div><span>Loading courses...</span></div>';
    
    fetch(BASE_URL + "/admin/courses", {
        headers: authHeader()
    })
    .then(res => res.json())
    .then(data => {
        allCourses = data.courses || [];
        updateStats();
        renderCourses();
    })
    .catch(err => {
        console.error(err);
        grid.innerHTML = '<div class="empty-state"><h3>Error loading courses</h3><p>Please refresh the page or try again later.</p></div>';
    });
}

// 📊 Update statistics
function updateStats(){
    document.getElementById('totalCourses').textContent = allCourses.length;
    document.getElementById('enrolledCourses').textContent = allCourses.filter(c => c.enrolled === true).length;
    document.getElementById('completedCourses').textContent = allCourses.filter(c => c.status === 'completed').length;
    document.getElementById('inProgressCourses').textContent = allCourses.filter(c => c.status === 'in-progress' || c.status === 'progress').length;
}

// 🎨 Render courses
function renderCourses(){
    const grid = document.getElementById("coursesGrid");
    const empty = document.getElementById("emptyState");
    const searchTerm = document.getElementById("searchInput").value.toLowerCase();
    
    let filtered = allCourses;

    // Apply filter
    if(currentFilter === 'enrolled'){
        filtered = filtered.filter(c => c.enrolled === true);
    } else if(currentFilter === 'available'){
        filtered = filtered.filter(c => c.enrolled !== true);
    }

    // Apply search
    filtered = filtered.filter(c => 
        (c.name || c.title || '').toLowerCase().includes(searchTerm) ||
        (c.description || '').toLowerCase().includes(searchTerm) ||
        (c.instructor || '').toLowerCase().includes(searchTerm)
    );

    if(filtered.length === 0){
        grid.style.display = "none";
        empty.style.display = "block";
        return;
    }

    grid.style.display = "grid";
    empty.style.display = "none";

    grid.innerHTML = filtered.map(course => `
        <div class="course-card">
            <div class="course-header">
                <div class="course-title">${course.name || course.title || 'Untitled'}</div>
                <div class="course-badge">${course.enrolled ? 'Enrolled' : 'Available'}</div>
            </div>
            
            <div class="course-desc">
                ${course.description || 'No description available'}
            </div>
            
            <div class="course-meta">
                <div class="course-meta-item">
                    <strong>👨‍🏫 Instructor:</strong>
                    <span>${course.instructor || 'N/A'}</span>
                </div>
                <div class="course-meta-item">
                    <strong>⏱️ Duration:</strong>
                    <span>${course.duration || 'Not specified'}</span>
                </div>
                ${course.credits ? `<div class="course-meta-item">
                    <strong>📌 Credits:</strong>
                    <span>${course.credits}</span>
                </div>` : ''}
                ${course.level ? `<div class="course-meta-item">
                    <strong>📊 Level:</strong>
                    <span>${course.level}</span>
                </div>` : ''}
            </div>

            <div class="course-actions">
                ${course.enrolled ? 
                    `<button class="btn" onclick="viewCourse('${course._id}')">View Course</button>` :
                    `<button class="btn" onclick="enrollCourse('${course._id}')">Enroll Now</button>`
                }
                <button class="btn btn-secondary" onclick="viewDetails('${course._id}')">Details</button>
            </div>
        </div>
    `).join("");
}

// 🔍 Filter courses
function filterCourses(filter){
    currentFilter = filter;
    
    // Update active button
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');
    
    renderCourses();
}

// 🔎 Search functionality
document.addEventListener('DOMContentLoaded', function(){
    const searchInput = document.getElementById('searchInput');
    if(searchInput){
        searchInput.addEventListener('input', renderCourses);
    }
});

// 👁️ View course
function viewCourse(courseId){
    console.log('Viewing course:', courseId);
    alert('Course content loading... (Feature coming soon)');
}

// ✋ Enroll in course
function enrollCourse(courseId){
    console.log('Enrolling in course:', courseId);
    alert('Enrollment processing... (Feature coming soon)');
}

// 📋 View course details
function viewDetails(courseId){
    const course = allCourses.find(c => c._id === courseId);
    if(course){
        alert(`📚 ${course.name}\n\n${course.description}\n\nInstructor: ${course.instructor}`);
    }
}

// 🚪 Logout
function logout(){
    localStorage.clear();
    window.location.href="./index.html";
}

// INIT
checkAuth();
loadCourses();
</script>

</body>
</html>
